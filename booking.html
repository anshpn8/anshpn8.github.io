<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form & Submissions Calendar</title>

    <!-- FullCalendar CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/main.min.css"
        rel="stylesheet"
    />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 100px);
            min-height: 600px;
        }

        /* Form Side */
        .form-section {
            flex: 1;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }

        .form-section iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
        }

        /* Calendar Side */
        .calendar-section {
            flex: 1;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* Highlight booked day */
        .fc-day-booked {
            background-color: #ffebee !important;
        }

        /* Booked event badge */
        .fc-event.booked-event {
            background-color: #d9534f !important;
            border-color: #d43f3a !important;
            color: white !important;
            text-align: center;
            font-weight: bold;
            font-size: 0.85em;
            padding: 2px 0;
            border-radius: 4px;
            cursor: default;
        }

        /* Mobile Responsive */
        @media (max-width: 900px) {
            body {
                padding: 10px;
            }

            h2 {
                font-size: 1.35rem;
                margin-bottom: 15px;
            }

            .container {
                flex-direction: column-reverse;
                height: auto;
                min-height: unset;
                gap: 15px;
            }

            .form-section,
            .calendar-section {
                width: 100%;
                height: 550px;
                padding: 12px;
            }

            .fc .fc-toolbar {
                flex-direction: column;
                gap: 10px;
                margin-bottom: 15px;
            }

            .fc .fc-toolbar-title {
                font-size: 1.15rem !important;
                text-align: center;
            }

            .fc .fc-button {
                padding: 5px 10px !important;
                font-size: 0.85rem !important;
            }
        }
    </style>
</head>

<body>

    <h2>Ertiga Car Booking</h2>

    <div class="container">

        <!-- Google Form -->
        <div class="form-section">
            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSenJhmCoo6HXwa3KmnW_8dfT9gMNVvs-bibV9j-oOSVVd3x9Q/viewform?embedded=true"
                loading="lazy">
                Loading…
            </iframe>
        </div>

        <!-- Calendar -->
        <div class="calendar-section">
            <div id="calendar"></div>
        </div>

    </div>

    <!-- FullCalendar JS -->
   <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<script>
const SHEET_ID = '1aJ2DjxuRBZHkVFl20LUFlNAosetKpZ5-oJRkOLE3MAQ';

document.addEventListener('DOMContentLoaded', function () {

    const calendarEl = document.getElementById('calendar');

    // Global booked dates array
    window.bookedDates = [];

    // Initialize FullCalendar
    const calendar = new FullCalendar.Calendar(calendarEl, {

    timeZone: 'local',

    initialView: 'dayGridMonth',

        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth'
        },

        height: '100%',

        events: [],

        // Highlight booked dates
        dayCellClassNames: function (arg) {

            const d = arg.date;

            const formatted =
                d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');

            if (window.bookedDates.includes(formatted)) {
                return ['fc-day-booked'];
            }

            return [];
        }
    });

    calendar.render();

    // Google Sheets callback
    window.google = {
        visualization: {
            Query: {
                setResponse: function (data) {
                    processSheetData(data);
                }
            }
        }
    };

    // Process Google Sheet data
    function processSheetData(data) {

        console.log("FULL RESPONSE:", data);

        const rows = data.table.rows;

        if (!rows || rows.length === 0) {
            console.error("No rows found");
            return;
        }

        // First column contains date/timestamp
        const dateColIndex = 4;

        const fetchedEvents = [];

        // Today's date
        const today = new Date();

        const todayStr =
            today.getFullYear() + '-' +
            String(today.getMonth() + 1).padStart(2, '0') + '-' +
            String(today.getDate()).padStart(2, '0');

        // Reset booked dates
        window.bookedDates = [];

        rows.forEach(row => {

            const cell = row.c[dateColIndex];

            if (!cell) return;

            let formattedDate = '';

            // Handle formatted date/time from Google Sheets
         if (cell.f) {

    // Example:
    // "5/17/2026 18:32:47"

    const datePart = cell.f.split(' ')[0];

    const parts = datePart.split('/');

    if (parts.length === 3) {

        const month = parts[0].padStart(2, '0');
        const day = parts[1].padStart(2, '0');
        const year = parts[2];

        formattedDate = `${year}-${month}-${day}`;
    }
}
            // Handle raw Google Date object
            else if (
                typeof cell.v === 'string' &&
                cell.v.includes('Date')
            ) {

                const match = cell.v.match(/\d+/g);

                if (match) {

                    const y = match[0];
                    const m = String(parseInt(match[1]) + 1).padStart(2, '0');
                    const d = String(match[2]).padStart(2, '0');

                    formattedDate = `${y}-${m}-${d}`;
                }
            }

            console.log("Parsed Date:", formattedDate);

            // Add future/today bookings
            if (formattedDate && formattedDate >= todayStr) {

                window.bookedDates.push(formattedDate);

fetchedEvents.push({
    title: 'Booked',
    start: formattedDate + 'T12:00:00',
    allDay: true,
    className: 'booked-event'
});
            }
        });

        console.log("Events:", fetchedEvents);

        // Refresh calendar events
        calendar.removeAllEvents();
        calendar.addEventSource(fetchedEvents);

        // Re-render for background highlight updates
        calendar.render();
    }

    // Fetch Google Sheet data
    const script = document.createElement('script');

    script.src =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:google.visualization.Query.setResponse`;

    document.body.appendChild(script);
});
</script>
</body>
</html>
