<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Submissions Calendar</title>
    
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet" />
    
 <style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f4f6f9;
        padding: 20px;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .container {
        display: flex;
        flex-direction: row;
        gap: 20px;
        max-width: 1400px;
        margin: 0 auto;
        height: calc(100vh - 100px);
        min-height: 600px;
    }

    /* Form Side */
    .form-section {
        flex: 1;
        background: #fff;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
    }

    .form-section iframe {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 4px;
    }

    /* Calendar Side */
    .calendar-section {
        flex: 1;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
    }

    /* Highlighted Day Tile (Cell Background) in Light Red */
    .fc-day-booked {
        background-color: #ffebee !important; /* Soft, light red background */
    }

    /* Custom Style for the "Booked" Text Event */
    .fc-event.booked-event {
        background-color: #d9534f !important; /* Darker red badge */
        border-color: #d43f3a !important;
        color: white !important;
        text-align: center;
        font-weight: bold;
        font-size: 0.85em;
        padding: 2px 0;
        border-radius: 4px;
        cursor: default;
    }

    /* --- MOBILE RESPONSIVE OVERRIDES --- */
    @media (max-width: 900px) {
        body {
            padding: 10px; /* Reduces page spacing for mobile screens */
        }

        h2 {
            font-size: 1.35rem;
            margin-bottom: 15px;
        }

        .container {
            display: flex;
            flex-direction: column-reverse; /* Flips the order: Calendar on top, Form on bottom */
            height: auto; /* Removes the screen-height restriction */
            min-height: unset;
            gap: 15px;
        }

        .form-section, .calendar-section {
            flex: none;
            width: 100%;
            height: 550px; /* Provides ideal scrolling height on mobile */
            padding: 12px;
        }

        /* Adjust the calendar font and header sizes on mobile */
        .fc .fc-toolbar {
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .fc .fc-toolbar-title {
            font-size: 1.15rem !important;
            text-align: center;
        }

        .fc .fc-button {
            padding: 5px 10px !important;
            font-size: 0.85rem !important;
        }
    }
</style>
</head>
<body>

    <h2>Ertiga Car Booking</h2>

    <div class="container">
        <div class="form-section">
            <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSenJhmCoo6HXwa3KmnW_8dfT9gMNVvs-bibV9j-oOSVVd3x9Q/viewform?embedded=true" width="640" height="1258" frameborder="0" marginheight="0" marginwidth="0">
                Loading…
            </iframe>
        </div>

        <div class="calendar-section">
            <div id="calendar"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <script>
        const SHEET_ID = '1aJ2DjxuRBZHkVFl20LUFlNAosetKpZ5-oJRkOLE3MAQ'; 
        const DATE_COLUMN_NAME = 'Date'; 

        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            
            // Initialize Calendar
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth'
                },
                height: '100%',
                events: [],
                
                // Colors the whole date cell if it matches a booked date
dayCellClassNames: function(arg) {
    let d = arg.date;
    let year = d.getFullYear();
    let month = String(d.getMonth() + 1).padStart(2, '0');
    let day = String(d.getDate()).padStart(2, '0');
    let formattedCellDate = `${year}-${month}-${day}`;

    if (window.bookedDates && window.bookedDates.includes(formattedCellDate)) {
        return ['fc-day-booked'];
    }
    return [];
}
            });

            calendar.render();

            // Setup global Google callback to process the incoming JSON without CORS blocks
            window.google = {
                visualization: {
                    Query: {
                        setResponse: function(data) {
                            processSheetData(data);
                        }
                    }
                }
            };

            // Global array to keep track of matched booked dates for background styles
            window.bookedDates = [];

            function processSheetData(data) {
                const cols = data.table.cols;
                let dateColIndex = -1;
                for (let i = 0; i < cols.length; i++) {
                    if (cols[i].label === DATE_COLUMN_NAME) {
                        dateColIndex = i;
                        break;
                    }
                }

                if (dateColIndex === -1) {
                    console.error(`Column named '${DATE_COLUMN_NAME}' not found!`);
                    return;
                }

                const fetchedEvents = [];
                const rows = data.table.rows;

                // Today's date in local time string format for comparison (YYYY-MM-DD)
                let today = new Date();
                let year = today.getFullYear();
                let month = String(today.getMonth() + 1).padStart(2, '0');
                let day = String(today.getDate()).padStart(2, '0');
                let todayStr = `${year}-${month}-${day}`;

                // Reset the global booked dates array
                window.bookedDates = [];

                rows.forEach(row => {
                    const cell = row.c[dateColIndex];
                    if (cell) {
                        let formattedDate = '';

                        if (cell.f) {
                            let parts = cell.f.split('/');
                            if (parts.length === 3) {
                                let m = parts[0].padStart(2, '0');
                                let d = parts[1].padStart(2, '0');
                                let y = parts[2];
                                formattedDate = `${y}-${m}-${d}`;
                            }
                        } 
                        else if (cell.v && typeof cell.v === 'string' && cell.v.includes('Date')) {
                            const match = cell.v.match(/\d+/g);
                            if (match) {
                                let y = match[0];
                                let m = (parseInt(match[1]) + 1).toString().padStart(2, '0');
                                let d = match[2].zfill(2);
                                formattedDate = `${y}-${m}-${d}`;
                            }
                        }

                        // Filter: Matches only today or dates in the future
                        if (formattedDate && formattedDate >= todayStr) {
                            window.bookedDates.push(formattedDate);
                            
                            fetchedEvents.push({
                                title: 'Booked',
                                start: formattedDate,
                                className: 'booked-event'
                            });
                        }
                    }
                });

                // Clear previous events and render the new ones
                calendar.removeAllEvents();
                calendar.addEventSource(fetchedEvents);

                // Re-render the calendar to apply the updated cell backgrounds
                calendar.render();
            }

            // Inject script tag directly to fetch the Google sheet data without a CORS block
            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`;
            document.body.appendChild(script);
        });
    </script>
</body>
</html>
